[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mellow-music-backend"
version = "1.0.0"
description = "Community-first music backend (FastAPI) for Mellow Music"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]",
    "mysql-connector-python==26.7.0",
    "yt-dlp>=2026.8.19",
    "spotipy==2.26.0",
    "customisedLogs==2.0.3",
    "rateLimitedQueues==0.0.3.post1",
    "randomisedString==1.4.1",
    "autoReRun==1.3.0",
    "cryptography==50.0.1",
    "requests==2.34.2",
    "redis==8.1.0",
    "colr==0.9.1",
]

# No distributable packages: code runs from source, this project exists
# so the platform installs dependencies and finds the entrypoint below.
[tool.setuptools]
packages = []

[tool.fastapi]
entrypoint = "_server:app"

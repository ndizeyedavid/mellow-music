<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .song-input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-button {
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .results {
            margin-top: 20px;
        }

        .thumbnail {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }

        .audio-controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        audio {
            width: 100%;
        }

        .lyrics {
            text-align: center;
            margin-top: 20px;
        }
    </style>
    <meta charset="UTF-8">
    <base href="{{ baseURI }}">
    <script>const baseURI = '{{ baseURI }}'</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | safe }}</title>
</head>

<body>
    <div class="container">
        <div class="header">
            <h3>Name or YT Link or Spotify Link:</h3>
            <form id="song-search-form">
                <input type="text" name="STRING" class="song-input" placeholder="Enter song name..." required>
                <button class="search-button" type="submit">Search</button>
            </form>
        </div>
        <div class="results" id="SONG-RESULT">Waiting for a search...</div>
    </div>

    <script>
        const searchForm = document.getElementById('song-search-form');
        const resultBox = document.getElementById('SONG-RESULT');

        function formatDuration(seconds) {
            if (!seconds || seconds <= 0) return 'Unknown';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${String(secs).padStart(2, '0')}`;
        }

        async function playSongByQuery(query) {
            resultBox.innerHTML = 'Preparing song...';
            try {
                const prepareRes = await fetch(`${baseURI}/api/prepare/${encodeURIComponent(query)}`);
                const prepareData = await prepareRes.json();
                const songId = prepareData.ID;

                if (!songId) {
                    resultBox.innerHTML = 'Song not found.';
                    return;
                }

                const fetchRes = await fetch(`${baseURI}/api/fetch/${songId}`);
                const song = await fetchRes.json();

                if (song.ERROR || !song.SONG_NAME) {
                    resultBox.innerHTML = 'Song not found.';
                    return;
                }

                const audioUrl = song.AUDIO_URL ? `<audio controls style="width:100%;margin-top:12px"><source src="${song.AUDIO_URL}" type="audio/mpeg"></audio>` : '';
                const thumb = song.THUMBNAIL ? `<img class="thumbnail" src="${song.THUMBNAIL}" alt="${song.SONG_NAME}">` : '';
                const lyrics = song.LYRICS ? `<div class="lyrics">${song.LYRICS}</div>` : '';

                resultBox.innerHTML = `
                    <h4>${song.SONG_NAME}</h4>
                    ${thumb}
                    <div class="audio-controls">${audioUrl}</div>
                    <p style="text-align:center; margin-top:12px;">Duration: ${formatDuration(song.DURATION)}</p>
                    ${lyrics}
                `;
            } catch (error) {
                resultBox.innerHTML = 'Search failed. Check the server log and try again.';
                console.error(error);
            }
        }

        function renderResults(results) {
            if (!Array.isArray(results) || !results.length) {
                resultBox.innerHTML = 'No songs found.';
                return;
            }

            const cards = results.map((item) => `
                <div style="border:1px solid #ddd; border-radius:8px; padding:10px; margin-bottom:10px; display:flex; gap:12px; align-items:center;">
                    <img src="${item.thumbnail || ''}" alt="${item.title || 'song'}" style="width:80px; height:80px; border-radius:6px; object-fit:cover; background:#eee;" />
                    <div style="flex:1; min-width:0;">
                        <div style="font-weight:bold; margin-bottom:4px;">${item.title || 'Unknown Title'}</div>
                        <div style="font-size:12px; color:#555; margin-bottom:8px;">${item.artist || 'Unknown Artist'} • ${formatDuration(item.duration)}</div>
                        <button type="button" data-query="${item.url || item.title || item.id}" style="padding:8px 12px; border:none; background:#007BFF; color:white; border-radius:4px; cursor:pointer;">Play</button>
                    </div>
                </div>
            `).join('');

            resultBox.innerHTML = cards;
            resultBox.querySelectorAll('button[data-query]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const query = button.getAttribute('data-query');
                    if (query) {
                        await playSongByQuery(query);
                    }
                });
            });
        }

        async function loadHomeResults() {
            try {
                const response = await fetch(`${baseURI}/api/home`);
                const data = await response.json();
                renderResults(data.results || []);
            } catch (error) {
                resultBox.innerHTML = 'Could not load homepage songs.';
                console.error(error);
            }
        }

        searchForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            const value = new FormData(searchForm).get('STRING')?.toString().trim();
            if (!value) {
                resultBox.innerHTML = 'Enter a song name or link first.';
                return;
            }

            resultBox.innerHTML = 'Searching songs...';
            try {
                const response = await fetch(`${baseURI}/api/search?q=${encodeURIComponent(value)}`);
                const data = await response.json();
                renderResults(data.results || []);
            } catch (error) {
                resultBox.innerHTML = 'Search failed. Check the server log and try again.';
                console.error(error);
            }
        });

        loadHomeResults();
    </script>
</body>

</html>
